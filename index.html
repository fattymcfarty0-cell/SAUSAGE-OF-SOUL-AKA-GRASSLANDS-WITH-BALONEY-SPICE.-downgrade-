<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baloney Furnace</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive, sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 900px;
      max-width: 95vw;
      height: 700px;
      max-height: 90vh;
      background: #87CEEB;
      border: 6px solid #333;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
    }
    #main-scene {
      position: absolute;
      inset: 0;
      background: url('furnace.jpg') center center / cover no-repeat;
    }
    /* Fire overlay - brightens / dims */
    #fire-overlay {
      position: absolute;
      left: 38%;
      top: 48%;
      width: 24%;
      height: 22%;
      background: radial-gradient(ellipse at center, rgba(255,200,50,0.7) 0%, rgba(255,100,0,0.4) 40%, transparent 70%);
      pointer-events: none;
      transition: opacity 0.8s ease;
      animation: flicker 0.15s infinite alternate;
    }
    @keyframes flicker {
      0% { opacity: 0.85; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.03); }
    }
    #fire-overlay.out {
      opacity: 0 !important;
      animation: none;
    }
    /* Smoke particle container */
    #smoke {
      position: absolute;
      left: 44%;
      top: 8%;
      width: 12%;
      height: 20%;
      pointer-events: none;
      opacity: 0.7;
      transition: opacity 1s;
    }
    #smoke.out { opacity: 0; }
    .smoke-puff {
      position: absolute;
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, rgba(80,80,80,0.6) 0%, transparent 70%);
      border-radius: 50%;
      animation: rise 3s linear infinite;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(0.6); opacity: 0.6; }
      100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
    }
    /* UI Panel */
    #ui {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      padding: 20px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    #status {
      color: #fff;
      font-size: 1.15rem;
      text-shadow: 2px 2px 4px #000;
      text-align: center;
      min-height: 1.4em;
    }
    #baloney-count {
      color: #ffd700;
      font-size: 1.3rem;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
    }
    button {
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: bold;
      padding: 12px 28px;
      border: 4px solid #222;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    button:active {
      transform: scale(0.95);
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    #produce-btn {
      background: linear-gradient(180deg, #ff6b6b, #c0392b);
      color: white;
      box-shadow: 0 4px 0 #7b241c, 0 6px 12px rgba(0,0,0,0.4);
    }
    #produce-btn:hover:not(:disabled) {
      background: linear-gradient(180deg, #ff8787, #e74c3c);
    }
    #chop-btn {
      background: linear-gradient(180deg, #2ecc71, #27ae60);
      color: white;
      box-shadow: 0 4px 0 #1e8449, 0 6px 12px rgba(0,0,0,0.4);
      display: none;
    }
    #chop-btn:hover {
      background: linear-gradient(180deg, #58d68d, #2ecc71);
    }
    #restart-btn {
      background: linear-gradient(180deg, #3498db, #2980b9);
      color: white;
      box-shadow: 0 4px 0 #1a5276, 0 6px 12px rgba(0,0,0,0.4);
      display: none;
      margin-top: 8px;
    }
    /* Aggressive text */
    #rage-text {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 700px;
      text-align: center;
      z-index: 20;
      pointer-events: none;
      display: none;
    }
    #rage-text p {
      color: #ff2222;
      font-size: 1.6rem;
      font-weight: 900;
      text-shadow:
        3px 3px 0 #000,
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        0 0 12px #ff0000;
      margin: 8px 0;
      animation: shake 0.4s infinite;
      line-height: 1.3;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-6px) rotate(-1deg); }
      40% { transform: translateX(6px) rotate(1deg); }
      60% { transform: translateX(-4px) rotate(-0.5deg); }
      80% { transform: translateX(4px) rotate(0.5deg); }
    }
    /* Minigame overlay */
    #minigame {
      position: absolute;
      inset: 0;
      background: linear-gradient(#87CEEB 0%, #87CEEB 55%, #5a9c3a 55%, #3d7a28 100%);
      z-index: 30;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 30px;
    }
    #minigame h2 {
      color: #fff;
      font-size: 2rem;
      text-shadow: 3px 3px 0 #000;
      margin-bottom: 8px;
    }
    #minigame-status {
      color: #ffd700;
      font-size: 1.3rem;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 20px;
    }
    #forest {
      position: relative;
      width: 100%;
      height: 420px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 40px;
      flex-wrap: wrap;
      padding: 0 40px;
    }
    .tree {
      position: relative;
      width: 90px;
      height: 220px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .tree:hover:not(.chopped) {
      transform: scale(1.05);
    }
    .tree .trunk {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 90px;
      background: linear-gradient(90deg, #5d3a1a, #8b5a2b, #5d3a1a);
      border-radius: 4px;
    }
    .tree .leaves {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 50px solid transparent;
      border-right: 50px solid transparent;
      border-bottom: 130px solid #228b22;
      filter: drop-shadow(0 4px 2px rgba(0,0,0,0.3));
    }
    .tree .leaves::before {
      content: '';
      position: absolute;
      top: 30px;
      left: -40px;
      width: 0;
      height: 0;
      border-left: 40px solid transparent;
      border-right: 40px solid transparent;
      border-bottom: 90px solid #2e8b57;
    }
    .tree.chopped .leaves {
      animation: fall 0.6s forwards;
    }
    .tree.chopped .trunk {
      height: 25px;
      background: #4a2f12;
    }
    @keyframes fall {
      0% { transform: translateX(-50%) rotate(0deg); opacity: 1; }
      100% { transform: translateX(-50%) translateY(80px) rotate(25deg); opacity: 0; }
    }
    .chop-count {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      color: #000;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.9rem;
      border: 2px solid #000;
      display: none;
    }
    .tree.chopped .chop-count {
      display: none;
    }
    #minigame-done {
      margin-top: 20px;
      display: none;
    }
    #back-btn {
      background: linear-gradient(180deg, #e67e22, #d35400);
      color: white;
      box-shadow: 0 4px 0 #a04000, 0 6px 12px rgba(0,0,0,0.4);
    }
    /* Timer bar */
    #timer-bar-container {
      width: 80%;
      max-width: 400px;
      height: 14px;
      background: #333;
      border: 2px solid #111;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 4px;
    }
    #timer-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #e74c3c, #f1c40f, #2ecc71);
      transition: width 0.1s linear;
    }
    #timer-bar.critical {
      background: #e74c3c;
      animation: pulse 0.3s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    /* Music button */
    #music-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 50;
      background: linear-gradient(180deg, #9b59b6, #8e44ad);
      color: white;
      box-shadow: 0 3px 0 #5b2c6f, 0 4px 10px rgba(0,0,0,0.4);
      font-size: 0.95rem;
      padding: 8px 16px;
      border: 3px solid #222;
      border-radius: 10px;
      cursor: pointer;
    }
    #music-btn:hover {
      background: linear-gradient(180deg, #bb8fce, #9b59b6);
    }
    #yt-player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Exact theme song: Sausage Of Soul AKA Grasslands With Baloney Spice Theme -->
    <div id="yt-player"></div>
    <button id="music-btn">▶ PLAY THEME SONG</button>
    <audio id="rage-sound" src="rage.mp3" preload="auto"></audio>

    <!-- MAIN SCENE -->
    <div id="main-scene">
      <div id="fire-overlay"></div>
      <div id="smoke">
        <div class="smoke-puff" style="left:10%; animation-delay:0s;"></div>
        <div class="smoke-puff" style="left:40%; animation-delay:0.8s;"></div>
        <div class="smoke-puff" style="left:70%; animation-delay:1.6s;"></div>
      </div>
      <div id="rage-text">
        <p id="rage1"></p>
        <p id="rage2"></p>
        <p id="rage3"></p>
      </div>
      <div id="ui">
        <div id="baloney-count">Baloney produced: 0</div>
        <div id="status">Fire is roaring. Keep producing!</div>
        <div id="timer-bar-container">
          <div id="timer-bar"></div>
        </div>
        <button id="produce-btn">PRODUCE BALONEY</button>
        <button id="chop-btn">CHOP TREES</button>
        <button id="restart-btn">RESTART FURNACE</button>
      </div>
    </div>

    <!-- TREE CHOPPING MINIGAME -->
    <div id="minigame">
      <h2>CHOP THOSE TREES!</h2>
      <div id="minigame-status">Click the trees to chop them! Need 5 logs for fuel.</div>
      <div id="forest"></div>
      <div id="minigame-done">
        <button id="back-btn">RETURN WITH LOGS</button>
      </div>
    </div>
  </div>

  <script>
    // ========== STATE ==========
    let baloney = 0;
    let fireAlive = true;
    let fireTimeLeft = 50; // seconds until fire dies
    const FIRE_DURATION = 50;
    let timerInterval = null;
    let logsCollected = 0;
    const LOGS_NEEDED = 4;
    let treesChopped = 0;

    const produceBtn = document.getElementById('produce-btn');
    const chopBtn = document.getElementById('chop-btn');
    const restartBtn = document.getElementById('restart-btn');
    const statusEl = document.getElementById('status');
    const baloneyEl = document.getElementById('baloney-count');
    const fireOverlay = document.getElementById('fire-overlay');
    const smoke = document.getElementById('smoke');
    const rageText = document.getElementById('rage-text');
    const timerBar = document.getElementById('timer-bar');
    const mainScene = document.getElementById('main-scene');
    const minigame = document.getElementById('minigame');
    const forest = document.getElementById('forest');
    const minigameStatus = document.getElementById('minigame-status');
    const minigameDone = document.getElementById('minigame-done');
    const backBtn = document.getElementById('back-btn');

    const rageLines = [
      ["GOD DAMMIT!", "YOU GET PAID .001 CENTS AN HOUR AND THIS IS HOW YOU TREAT ME!", "THE FIRE IS OUT YOU USELESS LUMP OF MEAT!"],
      ["ARE YOU KIDDING ME?!", "I HIRED YOU TO KEEP THE FIRE ALIVE, NOT TO STAND THERE LIKE A DECORATION!", "GET OUT THERE AND CHOP SOME TREES RIGHT NOW!"],
      ["OH FOR THE LOVE OF—", "YOU LET THE FIRE DIE?! AFTER EVERYTHING I'VE DONE FOR YOU?!", "CHOP. THE. TREES. NOW."],
      ["UNBELIEVABLE!", "YOU GET PAID .001 CENTS AN HOUR AND STILL CAN'T KEEP A SIMPLE FIRE GOING!", "MOVE YOUR SORRY HID AND CHOP SOME WOOD!"]
    ];

    // ========== FIRE TIMER ==========
    function startFireTimer() {
      fireTimeLeft = FIRE_DURATION;
      fireAlive = true;
      updateTimerBar();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!fireAlive) return;
        fireTimeLeft -= 0.1;
        updateTimerBar();
        if (fireTimeLeft <= 0) {
          fireDies();
        }
      }, 100);
    }

    function updateTimerBar() {
      const pct = Math.max(0, (fireTimeLeft / FIRE_DURATION) * 100);
      timerBar.style.width = pct + '%';
      if (pct < 25) {
        timerBar.classList.add('critical');
      } else {
        timerBar.classList.remove('critical');
      }
    }

    function fireDies() {
      fireAlive = false;
      clearInterval(timerInterval);
      fireOverlay.classList.add('out');
      smoke.classList.add('out');
      produceBtn.style.display = 'none';
      chopBtn.style.display = 'inline-block';
      restartBtn.style.display = 'none';
      statusEl.textContent = 'THE FIRE IS DEAD.';
      timerBar.style.width = '0%';

      // Aggressive text
      const lines = rageLines[Math.floor(Math.random() * rageLines.length)];
      document.getElementById('rage1').textContent = lines[0];
      document.getElementById('rage2').textContent = lines[1];
      document.getElementById('rage3').textContent = lines[2];
      rageText.style.display = 'block';

      // Play the angry noise
      const rageSound = document.getElementById('rage-sound');
      if (rageSound) {
        rageSound.currentTime = 0;
        rageSound.play().catch(() => {});
      }
    }

    // ========== PRODUCE BALONEY ==========
    produceBtn.addEventListener('click', () => {
      if (!fireAlive) return;
      baloney++;
      baloneyEl.textContent = `Baloney produced: ${baloney}`;
      // Tiny visual feedback
      produceBtn.style.transform = 'scale(0.9)';
      setTimeout(() => produceBtn.style.transform = '', 80);
    });

    // ========== CHOP TREES BUTTON ==========
    chopBtn.addEventListener('click', () => {
      enterMinigame();
    });

    // ========== RESTART ==========
    restartBtn.addEventListener('click', () => {
      if (logsCollected < LOGS_NEEDED) return;
      // Restart fire
      logsCollected = 0;
      fireOverlay.classList.remove('out');
      smoke.classList.remove('out');
      produceBtn.style.display = 'inline-block';
      chopBtn.style.display = 'none';
      restartBtn.style.display = 'none';
      rageText.style.display = 'none';
      statusEl.textContent = 'Fire is roaring again. Keep producing!';
      startFireTimer();
    });

    // ========== MINIGAME ==========
    function enterMinigame() {
      mainScene.style.display = 'none';
      minigame.style.display = 'flex';
      logsCollected = 0;
      treesChopped = 0;
      minigameDone.style.display = 'none';
      minigameStatus.textContent = `Click the trees to chop them! Need ${LOGS_NEEDED} logs for fuel. (0/${LOGS_NEEDED})`;
      buildForest();
    }

    function buildForest() {
      forest.innerHTML = '';
      // Create 7 trees
      for (let i = 0; i < 7; i++) {
        const tree = document.createElement('div');
        tree.className = 'tree';
        tree.innerHTML = `
          <div class="leaves"></div>
          <div class="trunk"></div>
          <div class="chop-count">0/3</div>
        `;
        let hits = 0;
        tree.addEventListener('click', () => {
          if (tree.classList.contains('chopped')) return;
          hits++;
          tree.querySelector('.chop-count').textContent = `${hits}/3`;
          tree.querySelector('.chop-count').style.display = 'block';
          // Shake
          tree.style.transform = `rotate(${(Math.random()-0.5)*8}deg)`;
          setTimeout(() => tree.style.transform = '', 100);
          if (hits >= 3) {
            tree.classList.add('chopped');
            treesChopped++;
            logsCollected++;
            minigameStatus.textContent = `Click the trees to chop them! Need ${LOGS_NEEDED} logs for fuel. (${logsCollected}/${LOGS_NEEDED})`;
            if (logsCollected >= LOGS_NEEDED) {
              minigameStatus.textContent = `You got enough logs! (${logsCollected}/${LOGS_NEEDED})`;
              minigameDone.style.display = 'block';
            }
          }
        });
        forest.appendChild(tree);
      }
    }

    backBtn.addEventListener('click', () => {
      minigame.style.display = 'none';
      mainScene.style.display = 'block';
      // Now allow restart
      restartBtn.style.display = 'inline-block';
      chopBtn.style.display = 'none';
      statusEl.textContent = `You brought back ${logsCollected} logs. Restart the furnace!`;
      rageText.style.display = 'none';
    });

    // ========== MUSIC (exact YouTube track) ==========
    let ytPlayer = null;
    let musicPlaying = false;
    const musicBtn = document.getElementById('music-btn');

    // Load YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '1',
        width: '1',
        videoId: 'rJaqLyGHIQ4',
        playerVars: {
          autoplay: 0,
          controls: 0,
          loop: 1,
          playlist: 'rJaqLyGHIQ4',
          modestbranding: 1,
          rel: 0,
          playsinline: 1
        },
        events: {
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED) {
              ytPlayer.playVideo(); // keep looping
            }
          }
        }
      });
    }
    // Make the callback global so the API can find it
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    musicBtn.addEventListener('click', () => {
      if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') {
        // fallback: just change button text
        musicBtn.textContent = '⏳ LOADING…';
        setTimeout(() => {
          if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
            toggleMusic();
          } else {
            musicBtn.textContent = '▶ PLAY THEME SONG';
          }
        }, 800);
        return;
      }
      toggleMusic();
    });

    function toggleMusic() {
      if (musicPlaying) {
        ytPlayer.pauseVideo();
        musicBtn.textContent = '▶ PLAY THEME SONG';
        musicPlaying = false;
      } else {
        ytPlayer.playVideo();
        ytPlayer.unMute();
        ytPlayer.setVolume(70);
        musicBtn.textContent = '⏸ MUTE THEME';
        musicPlaying = true;
      }
    }

    // ========== INIT ==========
    startFireTimer();
  </script>
</body>
</html>
