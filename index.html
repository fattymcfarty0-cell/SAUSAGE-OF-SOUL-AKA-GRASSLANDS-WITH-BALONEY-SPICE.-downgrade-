<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Baloney Furnace</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    html, body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game-container {
      position: relative;
      width: 960px;
      max-width: 98vw;
      height: 720px;
      max-height: 96vh;
      max-height: 96dvh;
      border: 6px solid #333;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.7);
      background: #87CEEB;
    }
    #c { display: block; width: 100%; height: 100%; touch-action: none; }
    #ui {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.82));
      padding: 18px 24px 26px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      z-index: 20; pointer-events: none;
    }
    #ui > * { pointer-events: auto; }
    #baloney-count {
      color: #ffd700; font-size: 1.35rem; font-weight: bold; text-shadow: 2px 2px 0 #000;
    }
    #status {
      color: #fff; font-size: 1.1rem; text-shadow: 2px 2px 4px #000;
      text-align: center; min-height: 1.3em;
    }
    #timer-bar-container {
      width: 80%; max-width: 420px; height: 14px; background: #222;
      border: 2px solid #111; border-radius: 8px; overflow: hidden;
    }
    #timer-bar {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #e74c3c, #f1c40f, #2ecc71);
      transition: width 0.1s linear;
    }
    #timer-bar.critical { background: #e74c3c; animation: pulse 0.3s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    button {
      font-family: inherit; font-size: 1.2rem; font-weight: bold;
      padding: 14px 28px; border: 4px solid #222; border-radius: 12px;
      cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
      transition: transform 0.08s;
      min-height: 48px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.94); }
    @media (max-width: 600px) {
      button { font-size: 1.05rem; padding: 16px 22px; width: 90%; max-width: 320px; }
      #rage-text p { font-size: 1.15rem; }
      #baloney-count { font-size: 1.15rem; }
      #status { font-size: 1rem; }
      #music-btn { font-size: 0.8rem; padding: 10px 12px; }
    }
    #produce-btn {
      background: linear-gradient(180deg, #ff6b6b, #c0392b); color: #fff;
      box-shadow: 0 4px 0 #7b241c, 0 6px 14px rgba(0,0,0,0.45);
    }
    #produce-btn:hover { background: linear-gradient(180deg, #ff8787, #e74c3c); }
    #chop-btn {
      background: linear-gradient(180deg, #2ecc71, #27ae60); color: #fff;
      box-shadow: 0 4px 0 #1e8449, 0 6px 14px rgba(0,0,0,0.45); display: none;
    }
    #chop-btn:hover { background: linear-gradient(180deg, #58d68d, #2ecc71); }
    #restart-btn {
      background: linear-gradient(180deg, #3498db, #2980b9); color: #fff;
      box-shadow: 0 4px 0 #1a5276, 0 6px 14px rgba(0,0,0,0.45); display: none;
    }
    #rage-text {
      position: absolute; top: 14%; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 720px; text-align: center; z-index: 25;
      pointer-events: none; display: none;
    }
    #rage-text p {
      color: #ff1a1a; font-size: 1.55rem; font-weight: 900;
      text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 14px #ff0000;
      margin: 7px 0; animation: shake 0.4s infinite; line-height: 1.25;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-7px) rotate(-1.2deg); }
      40% { transform: translateX(7px) rotate(1.2deg); }
      60% { transform: translateX(-4px) rotate(-0.6deg); }
      80% { transform: translateX(4px) rotate(0.6deg); }
    }
    #music-btn {
      position: absolute; top: 12px; right: 12px; z-index: 40;
      background: linear-gradient(180deg, #9b59b6, #8e44ad); color: #fff;
      box-shadow: 0 3px 0 #5b2c6f, 0 4px 10px rgba(0,0,0,0.4);
      font-size: 0.9rem; padding: 8px 14px; border: 3px solid #222;
      border-radius: 10px; cursor: pointer;
    }
    #music-btn:hover { background: linear-gradient(180deg, #bb8fce, #9b59b6); }
    #yt-player { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
    #minigame {
      position: absolute; inset: 0;
      background: linear-gradient(#87CEEB 0%, #87CEEB 52%, #5a9c3a 52%, #3d7a28 100%);
      z-index: 50; display: none; flex-direction: column; align-items: center; padding-top: 28px;
    }
    #minigame h2 { color: #fff; font-size: 2rem; text-shadow: 3px 3px 0 #000; margin-bottom: 6px; }
    #minigame-status { color: #ffd700; font-size: 1.25rem; text-shadow: 2px 2px 0 #000; margin-bottom: 18px; }
    #forest {
      position: relative; width: 100%; height: 400px; display: flex;
      justify-content: center; align-items: flex-end; gap: 36px; flex-wrap: wrap; padding: 0 30px;
    }
    .tree {
      position: relative; width: 90px; height: 220px; cursor: pointer;
      transition: transform 0.1s; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .tree:hover:not(.chopped), .tree:active:not(.chopped) { transform: scale(1.06); }
    @media (max-width: 600px) {
      .tree { width: 72px; height: 180px; }
      #forest { gap: 18px; height: 340px; padding: 0 12px; }
      #minigame h2 { font-size: 1.5rem; }
      #minigame-status { font-size: 1.05rem; }
    }
    .tree .trunk {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 28px; height: 90px;
      background: linear-gradient(90deg, #5d3a1a, #8b5a2b, #5d3a1a); border-radius: 4px;
    }
    .tree .leaves {
      position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 50px solid transparent; border-right: 50px solid transparent;
      border-bottom: 130px solid #228b22;
      filter: drop-shadow(0 4px 2px rgba(0,0,0,0.3));
    }
    .tree .leaves::before {
      content: ''; position: absolute; top: 30px; left: -40px; width: 0; height: 0;
      border-left: 40px solid transparent; border-right: 40px solid transparent;
      border-bottom: 90px solid #2e8b57;
    }
    .tree.chopped .leaves { animation: fall 0.55s forwards; }
    .tree.chopped .trunk { height: 24px; background: #4a2f12; }
    @keyframes fall {
      0% { transform: translateX(-50%) rotate(0); opacity: 1; }
      100% { transform: translateX(-50%) translateY(80px) rotate(28deg); opacity: 0; }
    }
    .chop-count {
      position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
      background: #fff; color: #000; font-weight: bold; padding: 2px 8px;
      border-radius: 10px; font-size: 0.85rem; border: 2px solid #000; display: none;
    }
    #minigame-done { margin-top: 16px; display: none; }
    #back-btn {
      background: linear-gradient(180deg, #e67e22, #d35400); color: #fff;
      box-shadow: 0 4px 0 #a04000, 0 6px 12px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="c"></canvas>
    <div id="yt-player"></div>
    <button id="music-btn">▶ PLAY THEME SONG</button>
    <audio id="rage-sound" src="rage.mp3" preload="auto"></audio>
    <div id="rage-text">
      <p id="rage1"></p><p id="rage2"></p><p id="rage3"></p>
    </div>
    <div id="ui">
      <div id="baloney-count">Baloney produced: 0</div>
      <div id="status">Fire is roaring. Keep producing!</div>
      <div id="timer-bar-container"><div id="timer-bar"></div></div>
      <button id="produce-btn">PRODUCE BALONEY</button>
      <button id="chop-btn">CHOP TREES</button>
      <button id="restart-btn">RESTART FURNACE</button>
    </div>
    <div id="minigame">
      <h2>CHOP THOSE TREES!</h2>
      <div id="minigame-status">Click the trees to chop them! Need 4 logs for fuel.</div>
      <div id="forest"></div>
      <div id="minigame-done"><button id="back-btn">RETURN WITH LOGS</button></div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('c');
    const produceBtn = document.getElementById('produce-btn');
    const chopBtn = document.getElementById('chop-btn');
    const restartBtn = document.getElementById('restart-btn');
    const statusEl = document.getElementById('status');
    const baloneyEl = document.getElementById('baloney-count');
    const rageText = document.getElementById('rage-text');
    const timerBar = document.getElementById('timer-bar');
    const minigame = document.getElementById('minigame');
    const forest = document.getElementById('forest');
    const minigameStatus = document.getElementById('minigame-status');
    const minigameDone = document.getElementById('minigame-done');
    const backBtn = document.getElementById('back-btn');
    const musicBtn = document.getElementById('music-btn');

    let baloney = 0, fireAlive = true, fireTimeLeft = 50;
    const FIRE_DURATION = 50;
    let timerInterval = null, logsCollected = 0;
    const LOGS_NEEDED = 4;
    let musicPlaying = false, ytPlayer = null;

    const rageLines = [
      ["GOD DAMMIT!", "YOU GET PAID .001 CENTS AN HOUR AND THIS IS HOW YOU TREAT ME!", "THE FIRE IS OUT YOU USELESS LUMP OF MEAT!"],
      ["ARE YOU KIDDING ME?!", "I HIRED YOU TO KEEP THE FIRE ALIVE, NOT TO STAND THERE LIKE A DECORATION!", "GET OUT THERE AND CHOP SOME TREES RIGHT NOW!"],
      ["OH FOR THE LOVE OF—", "YOU LET THE FIRE DIE?! AFTER EVERYTHING I'VE DONE FOR YOU?!", "CHOP. THE. TREES. NOW."],
      ["UNBELIEVABLE!", "YOU GET PAID .001 CENTS AN HOUR AND STILL CAN'T KEEP A SIMPLE FIRE GOING!", "MOVE YOUR SORRY HID AND CHOP SOME WOOD!"]
    ];

    // --- Three.js setup ---
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 28, 60);

    const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
    camera.position.set(0, 4.3, 12);
    camera.lookAt(0, 2.9, 0);

    scene.add(new THREE.HemisphereLight(0xb1e1ff, 0x88aa55, 0.9));
    const sun = new THREE.DirectionalLight(0xfff5e0, 1.2);
    sun.position.set(8, 14, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);
    const fireLight = new THREE.PointLight(0xff6600, 2.8, 12, 1.4);
    fireLight.position.set(0, 1.6, 1.7);
    scene.add(fireLight);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(70, 70),
      new THREE.MeshLambertMaterial({ color: 0x4a9c3a })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Background trees
    function makeTree(x, z, s = 1) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18*s, 0.25*s, 1.4*s, 6),
        new THREE.MeshLambertMaterial({ color: 0x5d3a1a })
      );
      trunk.position.y = 0.7*s; trunk.castShadow = true; g.add(trunk);
      const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(1.1*s, 2.4*s, 7),
        new THREE.MeshLambertMaterial({ color: 0x228b22 })
      );
      leaves.position.y = 2.2*s; leaves.castShadow = true; g.add(leaves);
      g.position.set(x, 0, z); scene.add(g);
    }
    makeTree(-7.5, -4, 1.3); makeTree(8, -3.5, 1.6);
    makeTree(-9.5, 2, 1); makeTree(9.5, 1.5, 1.2);
    makeTree(-5.5, -9, 1.8); makeTree(6.5, -10, 1.4);

    function makeBuilding(x, z, w, h, d, col) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: col }));
      m.position.set(x, h/2, z); m.castShadow = true; m.receiveShadow = true; scene.add(m);
    }
    makeBuilding(-6.8, 3.8, 2.2, 1.8, 2, 0x8b5a2b);
    makeBuilding(7.2, 4.2, 1.8, 1.4, 1.6, 0xa0522d);

    // ===== FURNACE + BOSS =====
    const furnace = new THREE.Group();
    scene.add(furnace);
    const brickMat = new THREE.MeshLambertMaterial({ color: 0xb07a4a });
    const darkBrick = new THREE.MeshLambertMaterial({ color: 0x8a5a35 });
    const stoneMat = new THREE.MeshLambertMaterial({ color: 0x6e6e6e });

    const base = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.5, 3.2), brickMat);
    base.position.y = 0.25; base.castShadow = true; base.receiveShadow = true; furnace.add(base);

    const body = new THREE.Mesh(new THREE.BoxGeometry(3.6, 3.0, 2.6), brickMat);
    body.position.y = 2.0; body.castShadow = true; body.receiveShadow = true; furnace.add(body);

    const ledge = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.35, 2.9), darkBrick);
    ledge.position.y = 3.55; ledge.castShadow = true; furnace.add(ledge);

    const chimney = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.8, 1.6), brickMat);
    chimney.position.set(0, 5.1, -0.2); chimney.castShadow = true; furnace.add(chimney);

    const chimTop = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.4, 1.9), darkBrick);
    chimTop.position.set(0, 6.5, -0.2); chimTop.castShadow = true; furnace.add(chimTop);

    const opening = new THREE.Mesh(
      new THREE.BoxGeometry(1.7, 1.5, 0.25),
      new THREE.MeshBasicMaterial({ color: 0x120800 })
    );
    opening.position.set(0, 1.7, 1.28); furnace.add(opening);

    // Fire — placed in front of the dark opening so it always shows
    const fireGroup = new THREE.Group(); furnace.add(fireGroup);
    const fire1 = new THREE.Mesh(
      new THREE.PlaneGeometry(1.55, 1.45),
      new THREE.MeshBasicMaterial({ color: 0xffcc33, transparent: true, opacity: 1, side: THREE.DoubleSide, depthWrite: false })
    );
    fire1.position.set(0, 1.7, 1.55); fireGroup.add(fire1);
    const fire2 = new THREE.Mesh(
      new THREE.PlaneGeometry(1.25, 1.2),
      new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false })
    );
    fire2.position.set(0, 1.65, 1.58); fireGroup.add(fire2);
    const fire3 = new THREE.Mesh(
      new THREE.PlaneGeometry(0.65, 0.85),
      new THREE.MeshBasicMaterial({ color: 0xffffaa, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthWrite: false })
    );
    fire3.position.set(0, 1.55, 1.61); fireGroup.add(fire3);

    // Smoke
    const smokeParticles = [];
    for (let i = 0; i < 12; i++) {
      const p = new THREE.Mesh(
        new THREE.SphereGeometry(0.22 + Math.random()*0.2, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0x555555, transparent: true, opacity: 0.3 })
      );
      p.position.set((Math.random()-0.5)*0.8, 6.7+Math.random()*2, -0.2+(Math.random()-0.5)*0.4);
      p.userData = { speed: 0.008+Math.random()*0.012, offset: Math.random()*10 };
      furnace.add(p); smokeParticles.push(p);
    }

    // CLOWN BOSS — texture is already a face photo, so use a front disc + red ball
    // (wrapping a portrait on a full sphere stretches it badly)
    const texLoader = new THREE.TextureLoader();
    const clownTex = texLoader.load('clown_tex.png');
    clownTex.colorSpace = THREE.SRGBColorSpace;

    // Red sphere body (the "ball")
    const bossSphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.88, 48, 48),
      new THREE.MeshLambertMaterial({ color: 0x8b1a1a })
    );
    bossSphere.position.set(0, 4.35, 1.5);
    bossSphere.castShadow = true;
    furnace.add(bossSphere);

    // Face plate — your image facing the camera, slight curve via large sphere segment look
    const facePlane = new THREE.Mesh(
      new THREE.CircleGeometry(0.86, 48),
      new THREE.MeshBasicMaterial({ map: clownTex, side: THREE.DoubleSide, transparent: false })
    );
    facePlane.position.set(0, 4.35, 1.5 + 0.87);
    furnace.add(facePlane);

    function onResize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', onResize);
    onResize();

    // --- Touch / pointer camera orbit (only while finger/mouse is down) ---
    let isDragging = false;
    let prevPointerX = 0;
    let prevPointerY = 0;
    let camAngleX = 0;   // horizontal orbit
    let camAngleY = 0.12; // vertical tilt
    const camDistance = 12;
    const camTarget = new THREE.Vector3(0, 3.0, 0);

    function updateCameraFromOrbit() {
      const x = Math.sin(camAngleX) * Math.cos(camAngleY) * camDistance;
      const y = Math.sin(camAngleY) * camDistance + 2.5;
      const z = Math.cos(camAngleX) * Math.cos(camAngleY) * camDistance;
      camera.position.set(x, y, z);
      camera.lookAt(camTarget);
    }
    updateCameraFromOrbit();

    function onPointerDown(e) {
      // Only orbit when touching the canvas (not UI buttons)
      if (e.target !== canvas) return;
      isDragging = true;
      prevPointerX = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      prevPointerY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    }
    function onPointerMove(e) {
      if (!isDragging) return;
      const x = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : prevPointerX);
      const y = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : prevPointerY);
      const dx = x - prevPointerX;
      const dy = y - prevPointerY;
      prevPointerX = x;
      prevPointerY = y;
      camAngleX -= dx * 0.005;
      camAngleY += dy * 0.004;
      camAngleY = Math.max(-0.15, Math.min(0.55, camAngleY));
      updateCameraFromOrbit();
    }
    function onPointerUp(e) {
      isDragging = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    }

    canvas.addEventListener('pointerdown', onPointerDown, { passive: true });
    canvas.addEventListener('pointermove', onPointerMove, { passive: true });
    canvas.addEventListener('pointerup', onPointerUp, { passive: true });
    canvas.addEventListener('pointercancel', onPointerUp, { passive: true });
    // Prevent page scroll while interacting with the game
    canvas.addEventListener('touchstart', (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { if (isDragging) e.preventDefault(); }, { passive: false });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Boss face animation (sphere + face plate bob together)
      const bossY = 4.35 + Math.sin(t * 1.3) * 0.05;
      bossSphere.position.y = bossY;
      facePlane.position.y = bossY;
      // Subtle face turn
      facePlane.rotation.y = Math.sin(t * 0.55) * 0.12;

      if (fireAlive) {
        fire1.material.opacity = 0.85 + Math.sin(t * 17) * 0.15;
        fire2.material.opacity = 0.7 + Math.sin(t * 21 + 1) * 0.2;
        fire3.material.opacity = 0.8 + Math.sin(t * 25) * 0.2;
        fire1.scale.y = 0.94 + Math.sin(t * 11) * 0.09;
        fire2.scale.y = 0.92 + Math.sin(t * 13 + 0.5) * 0.1;
        fireLight.intensity = 2.4 + Math.sin(t * 14) * 0.8;
        fireGroup.visible = true;
      } else {
        fireGroup.visible = false;
        fireLight.intensity = 0;
      }

      smokeParticles.forEach((p, i) => {
        if (!fireAlive) {
          p.material.opacity = Math.max(0, p.material.opacity - 0.012);
          return;
        }
        p.material.opacity = 0.22 + Math.sin(t + p.userData.offset) * 0.1;
        p.position.y += p.userData.speed;
        p.position.x += Math.sin(t * 0.6 + i) * 0.003;
        if (p.position.y > 10.5) {
          p.position.y = 6.7;
          p.position.x = (Math.random() - 0.5) * 0.8;
        }
      });

      // Idle sway only when not dragging
      if (!isDragging) {
        const idleX = Math.sin(t * 0.12) * 0.15;
        camera.position.x += (idleX - (camera.position.x - Math.sin(camAngleX) * Math.cos(camAngleY) * camDistance)) * 0.02;
      }
      camera.lookAt(camTarget);
      renderer.render(scene, camera);
    }
    animate();

    // --- Game logic ---
    function startFireTimer() {
      fireTimeLeft = FIRE_DURATION;
      fireAlive = true;
      updateTimerBar();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!fireAlive) return;
        fireTimeLeft -= 0.1;
        updateTimerBar();
        if (fireTimeLeft <= 0) fireDies();
      }, 100);
    }
    function updateTimerBar() {
      const pct = Math.max(0, (fireTimeLeft / FIRE_DURATION) * 100);
      timerBar.style.width = pct + '%';
      timerBar.classList.toggle('critical', pct < 25);
    }
    function fireDies() {
      fireAlive = false;
      clearInterval(timerInterval);
      produceBtn.style.display = 'none';
      chopBtn.style.display = 'inline-block';
      restartBtn.style.display = 'none';
      statusEl.textContent = 'THE FIRE IS DEAD.';
      timerBar.style.width = '0%';
      const lines = rageLines[Math.floor(Math.random() * rageLines.length)];
      document.getElementById('rage1').textContent = lines[0];
      document.getElementById('rage2').textContent = lines[1];
      document.getElementById('rage3').textContent = lines[2];
      rageText.style.display = 'block';
      const rs = document.getElementById('rage-sound');
      if (rs) { rs.currentTime = 0; rs.play().catch(() => {}); }
    }

    produceBtn.addEventListener('click', () => {
      if (!fireAlive) return;
      baloney++;
      baloneyEl.textContent = `Baloney produced: ${baloney}`;
      produceBtn.style.transform = 'scale(0.9)';
      setTimeout(() => produceBtn.style.transform = '', 80);
    });
    chopBtn.addEventListener('click', () => enterMinigame());
    restartBtn.addEventListener('click', () => {
      if (logsCollected < LOGS_NEEDED) return;
      logsCollected = 0;
      produceBtn.style.display = 'inline-block';
      chopBtn.style.display = 'none';
      restartBtn.style.display = 'none';
      rageText.style.display = 'none';
      statusEl.textContent = 'Fire is roaring again. Keep producing!';
      smokeParticles.forEach(p => p.material.opacity = 0.3);
      startFireTimer();
    });

    function enterMinigame() {
      minigame.style.display = 'flex';
      logsCollected = 0;
      minigameDone.style.display = 'none';
      minigameStatus.textContent = `Click the trees to chop them! Need ${LOGS_NEEDED} logs for fuel. (0/${LOGS_NEEDED})`;
      buildForest();
    }
    function buildForest() {
      forest.innerHTML = '';
      for (let i = 0; i < 7; i++) {
        const tree = document.createElement('div');
        tree.className = 'tree';
        tree.innerHTML = '<div class="leaves"></div><div class="trunk"></div><div class="chop-count">0/3</div>';
        let hits = 0;
        let lastTap = 0;
        // pointerdown = instant response on mobile (no 300ms click delay)
        const chopOnce = (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (tree.classList.contains('chopped')) return;
          const now = performance.now();
          if (now - lastTap < 80) return; // debounce double events
          lastTap = now;
          hits++;
          const cc = tree.querySelector('.chop-count');
          cc.textContent = hits + '/3';
          cc.style.display = 'block';
          tree.style.transform = `rotate(${(Math.random()-0.5)*8}deg) scale(1.08)`;
          setTimeout(() => tree.style.transform = '', 120);
          if (hits >= 3) {
            tree.classList.add('chopped');
            logsCollected++;
            minigameStatus.textContent = `Click the trees to chop them! Need ${LOGS_NEEDED} logs for fuel. (${logsCollected}/${LOGS_NEEDED})`;
            if (logsCollected >= LOGS_NEEDED) {
              minigameStatus.textContent = `You got enough logs! (${logsCollected}/${LOGS_NEEDED})`;
              minigameDone.style.display = 'block';
            }
          }
        };
        tree.addEventListener('pointerdown', chopOnce);
        forest.appendChild(tree);
      }
    }
    backBtn.addEventListener('click', () => {
      minigame.style.display = 'none';
      restartBtn.style.display = 'inline-block';
      chopBtn.style.display = 'none';
      statusEl.textContent = `You brought back ${logsCollected} logs. Restart the furnace!`;
      rageText.style.display = 'none';
    });

    // Music
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player('yt-player', {
        height: '1', width: '1', videoId: 'rJaqLyGHIQ4',
        playerVars: { autoplay: 0, controls: 0, loop: 1, playlist: 'rJaqLyGHIQ4', modestbranding: 1, rel: 0, playsinline: 1 },
        events: { onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) ytPlayer.playVideo(); } }
      });
    };
    musicBtn.addEventListener('click', () => {
      if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') {
        musicBtn.textContent = '⏳ LOADING…';
        setTimeout(() => {
          if (ytPlayer && typeof ytPlayer.playVideo === 'function') toggleMusic();
          else musicBtn.textContent = '▶ PLAY THEME SONG';
        }, 900);
        return;
      }
      toggleMusic();
    });
    function toggleMusic() {
      if (musicPlaying) {
        ytPlayer.pauseVideo();
        musicBtn.textContent = '▶ PLAY THEME SONG';
        musicPlaying = false;
      } else {
        ytPlayer.playVideo(); ytPlayer.unMute(); ytPlayer.setVolume(70);
        musicBtn.textContent = '⏸ MUTE THEME';
        musicPlaying = true;
      }
    }

    startFireTimer();
  </script>
</body>
</html>
